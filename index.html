<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Minimalista</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #09090b;
      color: #fafafa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calculator {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 24px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .display {
      background-color: #09090b;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: right;
      border: 1px solid #27272a;
    }

    .history {
      color: #71717a;
      font-size: 0.85rem;
      min-height: 20px;
      margin-bottom: 4px;
      overflow: hidden;
    }

    .current {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      background-color: #27272a;
      color: #fafafa;
      border: none;
      border-radius: 14px;
      padding: 18px;
      font-size: 1.15rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background-color: #3f3f46;
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.96);
    }

    .operator {
      background-color: #1e293b;
      color: #38bdf8;
    }

    .operator:hover {
      background-color: #0f172a;
    }

    .clear {
      background-color: #3f1d24;
      color: #fb7185;
    }

    .clear:hover {
      background-color: #4c1d24;
    }

    .equals {
      background-color: #38bdf8;
      color: #09090b;
      font-weight: 700;
      grid-column: span 2;
    }

    .equals:hover {
      background-color: #7dd3fc;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="display">0</div>
    </div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="appendOperator('%')">%</button>
      <button class="operator" onclick="appendOperator('/')">÷</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('*')">×</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('-')">−</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button class="zero" onclick="appendNumber('0')">0</button>
      <button onclick="appendNumber('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentInput = '0';
    let historyText = '';
    const displayEl = document.getElementById('display');
    const historyEl = document.getElementById('history');

    function updateDisplay() {
      displayEl.textContent = currentInput;
      historyEl.textContent = historyText;
    }

    function appendNumber(num) {
      if (currentInput === '0' && num !== '.') {
        currentInput = num;
      } else {
        const parts = currentInput.split(/[\+\-\*\/%]/);
        const lastPart = parts[parts.length - 1];
        if (num === '.' && lastPart.includes('.')) return;
        currentInput += num;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '*', '/', '%'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1) + op;
      } else {
        currentInput += op;
      }
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      historyText = '';
      updateDisplay();
    }

    function deleteLast() {
      currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
      updateDisplay();
    }

    function calculate() {
      try {
        historyText = currentInput + ' =';
        const result = Function('"use strict";return (' + currentInput + ')')();
        currentInput = Number.isInteger(result) ? String(result) : String(parseFloat(result.toFixed(6)));
      } catch {
        currentInput = 'Erro';
      }
      updateDisplay();
    }
  </script>
</body>
</html>
